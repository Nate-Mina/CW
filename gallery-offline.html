  :root { --fire:#d4622a; --cream:#f4e9d8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Times New Roman",Georgia,serif; background:#1a1410; color:var(--cream); }
  header { text-align:center; padding:54px 16px 22px;
            background:radial-gradient(circle at 50% 0%, #3a1d0e 0%, #1a1410 72%); }
  header h1 { margin:0; font-size:2.4rem; letter-spacing:.08em; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  header p { margin:10px auto 0; max-width:640px; color:#cdbba6; font-size:1.05rem; }
  .grid { column-count:4; column-gap:14px; padding:28px 22px 30px; max-width:1280px; margin:0 auto; }
  .g-card { margin:0 0 14px; break-inside:avoid; border-radius:6px; overflow:hidden;
            box-shadow:0 6px 18px rgba(0,0,0,.45); background:#241a12; }
  .g-card img { display:block; width:100%; height:auto; transition:transform .35s ease, filter .35s ease; }
  .g-card:hover img { transform:scale(1.04); filter:brightness(1.08); }
  @media (max-width:1100px){ .grid{column-count:3;} }
  @media (max-width:760px){ .grid{column-count:2;} }
  @media (max-width:460px){ .grid{column-count:1;} }
  footer { text-align:center; padding:26px 16px 40px; color:#8c7a66; font-size:.9rem; border-top:1px solid #2c2016; }
  footer a { color:var(--fire); text-decoration:none; }
</style>

  <script id="cw-navfix-js">
   (function(){
     function init(){
       var menus = document.querySelectorAll('li.wixui-dropdown-menu__item');
       menus.forEach(function(li){
         if(li.dataset.cwNavFix) return; li.dataset.cwNavFix = "1";
         var ul = li.querySelector('ul[aria-hidden]'); if(!ul) return;
         function toggle(e){ e.preventDefault(); e.stopPropagation();
           var open = li.classList.toggle('cw-menu-open');
           li.setAttribute('aria-expanded', open ? 'true' : 'false');
           ul.setAttribute('aria-hidden', open ? 'false' : 'true'); }
         li.addEventListener('click', function(e){
           if(e.target.closest('a')) return;
           toggle(e);
         });
       });
       document.addEventListener('click', function(e){
         document.querySelectorAll('li.wixui-dropdown-menu__item.cw-menu-open').forEach(function(li){
           if(!li.contains(e.target)){ li.classList.remove('cw-menu-open');
             li.setAttribute('aria-expanded','false');
             var u=li.querySelector('ul[aria-hidden]'); if(u) u.setAttribute('aria-hidden','true'); }
         });
       });
     }
     if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
   })();
  </script>
